openapi: 3.1.0
info:
  title: Mood News Grid API
  version: 0.1.0
  description: Read, rewrite, ingestion and evidence endpoints for the prototype.
servers:
  - url: http://localhost:3000
paths:
  /api/health:
    get:
      summary: Health and configuration status
      responses:
        '200':
          description: Healthy
  /api/news:
    get:
      summary: List real news with selected validated mood
      parameters:
        - in: query
          name: mood
          schema: { $ref: '#/components/schemas/Mood' }
        - in: query
          name: lang
          schema: { $ref: '#/components/schemas/Locale' }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200': { description: Article list }
  /api/news/{id}:
    get:
      summary: Get source/rewrite comparison and protected facts
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: mood
          schema: { $ref: '#/components/schemas/Mood' }
        - in: query
          name: lang
          schema: { $ref: '#/components/schemas/Locale' }
      responses:
        '200': { description: Article detail }
        '404': { description: Not found }
  /api/news/{id}/rewrite:
    post:
      summary: Generate and validate all mood variants
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: lang
          schema: { $ref: '#/components/schemas/Locale' }
      responses:
        '200': { description: Generated or returned from cache }
        '404': { description: Not found }
        '429': { description: Rate or cost limited }
        '502': { description: Both model attempts failed }
  /api/ops/summary:
    get:
      summary: Pipeline evidence and metrics
      responses:
        '200': { description: Operational summary }
  /api/jobs/ingest:
    post:
      security: [{ cronBearer: [] }]
      summary: Trigger one ingestion run
      responses:
        '200': { description: Job result }
        '401': { description: Invalid secret }
  /api/jobs/rewrite-pending:
    post:
      security: [{ cronBearer: [] }]
      summary: Rewrite pending articles
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Job result; may stop early when the daily AI budget is reached
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  data:
                    type: object
                    properties:
                      requestId: { type: string }
                      acquired: { type: boolean }
                      selected: { type: integer }
                      processed: { type: integer }
                      succeeded: { type: integer }
                      failed: { type: integer }
                      budgetBlocked: { type: boolean }
                      errors:
                        type: array
                        items: { type: string }
        '401': { description: Invalid secret }
components:
  securitySchemes:
    cronBearer:
      type: http
      scheme: bearer
  schemas:
    Mood:
      type: string
      enum: [neutral, hopeful, concerned, ironic]
    Locale:
      type: string
      enum: [en, ru]
      default: en
